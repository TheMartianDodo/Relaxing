<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Little Aquarium</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
#restockPanel div::-webkit-scrollbar { width: 8px; }
#restockPanel div::-webkit-scrollbar-track { background: rgba(234,246,255,0.07); border-radius: 4px; }
#restockPanel div::-webkit-scrollbar-thumb { background: rgba(234,246,255,0.35); border-radius: 4px; }
#restockPanel div::-webkit-scrollbar-thumb:hover { background: rgba(234,246,255,0.55); }
  html,body{margin:0;padding:0;overflow:hidden;background:#08131a;height:100%;width:100%;}
  canvas{display:block;}
  #loading{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#08131a;color:#cfe9f2;font-family:Georgia,'Times New Roman',serif;

  }
</style>
</head>
<body>
<div id="loading">Filling the tank&hellip;</div>
<div id="fishCamHud" style="display:none; position:fixed; top:16px; left:50%; transform:translateX(-50%); color:#ff2b2b; font-family:Georgia,'Times New Roman',serif; font-size:20px; font-weight:bold; letter-spacing:2px; text-shadow:0 0 10px rgba(255,30,30,0.65), 0 2px 4px rgba(0,0,0,0.85); z-index:15; pointer-events:none; white-space:nowrap;">** FISH CAM: <span id="fishCamSpecies"></span> **</div>
<div id="statsHud" style="display:none; position:fixed; top:16px; left:16px; color:#eaf6ff; font-family:'Courier New',monospace; font-size:13px; line-height:1.6; background:rgba(8,18,24,0.7); border:1px solid rgba(234,246,255,0.25); border-radius:6px; padding:10px 14px; z-index:15; pointer-events:none; white-space:pre;"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

// ---------------------------------------------------------------
// SETUP
// ---------------------------------------------------------------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.05, 100);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
// soft shadows — every rock, plant and fish in this file already sets cast/receiveShadow
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// real inverse-square falloff; light intensities below are retuned in candela to suit
renderer.physicallyCorrectLights = true;
const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const dummy = new THREE.Object3D();
const lookScratch = new THREE.Object3D();
const clock = new THREE.Clock();

// a small environment map for realistic reflective sheen — generated once, defensively wrapped,
// and applied only to specific materials (not scene.environment) so it stays a scoped enhancement
let sharedEnvMap = null;
try {
  const envCanvas = document.createElement('canvas');
  envCanvas.width = 32; envCanvas.height = 32;
  const ectx = envCanvas.getContext('2d');
  const egrad = ectx.createLinearGradient(0,0,0,32);
  egrad.addColorStop(0, '#bfe6f2');
  egrad.addColorStop(0.45, '#8fc9d9');
  egrad.addColorStop(0.75, '#2d5a4a');
  egrad.addColorStop(1, '#16302a');
  ectx.fillStyle = egrad;
  ectx.fillRect(0,0,32,32);
  const envTex = new THREE.CanvasTexture(envCanvas);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  envTex.encoding = THREE.sRGBEncoding;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  sharedEnvMap = pmrem.fromEquirectangular(envTex).texture;
  pmrem.dispose();
} catch(e) {
  console.warn('Environment map unavailable; angelfish will render without reflective sheen.', e);
  sharedEnvMap = null;
}

// scene-wide reflections for every PBR material, not just the angelfish
if (sharedEnvMap) scene.environment = sharedEnvMap;

scene.background = new THREE.Color(0x0a1a22);
scene.fog = new THREE.FogExp2(0x0e2a33, 0.055);

// ---------------------------------------------------------------
// TANK DIMENSIONS
// ---------------------------------------------------------------
const W = 18.6, H = 3.3, D = 2.9; // interior width, height, depth
const HALF_W = W/2, HALF_D = D/2;

// ---------------------------------------------------------------
// LIGHTING — warm light from above, cool ambient glow inside the tank
// ---------------------------------------------------------------
const ambientLight = new THREE.AmbientLight(0x224455, 0.55);
scene.add(ambientLight);
const topLight = new THREE.SpotLight(0xfff2d8, 26, 14, Math.PI/3.2, 0.5, 2);
topLight.position.set(0, H+2.2, 0.6);
topLight.target.position.set(0, 0, 0);
topLight.castShadow = true;
topLight.shadow.mapSize.set(2048, 2048);
topLight.shadow.camera.near = 0.5;
topLight.shadow.camera.far = 16;
topLight.shadow.bias = -0.0006;
topLight.shadow.normalBias = 0.02;
topLight.shadow.radius = 3;
scene.add(topLight, topLight.target);
const glowFill = new THREE.PointLight(0x4fb3d9, 3.5, 10, 2);
glowFill.position.set(0, H*0.4, D);
scene.add(glowFill);
const baseLightIntensity = { ambient: ambientLight.intensity, top: topLight.intensity, glow: glowFill.intensity };

// ---------------------------------------------------------------
// TANK — glass box, gravel, back wall, frame, stand
// ---------------------------------------------------------------
{
  const backMat = new THREE.MeshStandardMaterial({color:0x0c2b36, roughness:0.9});
  const back = new THREE.Mesh(new THREE.PlaneGeometry(W, H), backMat);
  back.position.set(0, H/2, -HALF_D);
  back.receiveShadow = true;
  scene.add(back);

  const sideMat = new THREE.MeshPhysicalMaterial({color:0xbfe3ee, roughness:0.05, transparent:true, opacity:0.06, side:THREE.DoubleSide});
  const sideGeo = new THREE.PlaneGeometry(D, H);
  const left = new THREE.Mesh(sideGeo, sideMat);
  left.rotation.y = Math.PI/2; left.position.set(-HALF_W, H/2, 0);
  const right = left.clone(); right.position.set(HALF_W, H/2, 0);
  scene.add(left, right);

  {
    const segsX = Math.round(48 * (W/6.2)), segsZ = 30;
    const floorGeo = new THREE.PlaneGeometry(W, D, segsX, segsZ);
    const pos = floorGeo.attributes.position;
    const baseCol = new THREE.Color(0x362b20);
    const darkCol = baseCol.clone().lerp(new THREE.Color(0x000000), 0.45);
    const lightCol = baseCol.clone().lerp(new THREE.Color(0x7a6248), 0.7);
    const colors = [];
    for(let i=0;i<pos.count;i++){
      const x = pos.getX(i), y = pos.getY(i);
      const dune = fbm3(x*0.35+50, y*0.55+50, 0, 3) - 0.5;   // broad dunes
      const ripple = fbm3(x*2.2+50, y*2.8+50, 3, 2) - 0.5;   // mid ripples
      const grain = fbm3(x*9+50, y*9+50, 7, 2) - 0.5;        // fine sand grain
      pos.setZ(i, dune*0.03 + ripple*0.01 + grain*0.003); // local Z becomes world Y after rotation below
      const t = THREE.MathUtils.clamp(0.5 + dune*0.7 + ripple*0.3 + grain*0.25, 0, 1);
      const col = darkCol.clone().lerp(lightCol, t);
      colors.push(col.r, col.g, col.b);
    }
    floorGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
    floorGeo.computeVertexNormals();
    const sandGrainTex = makeGrainTexture(128, 0.12, 11.3, 3);
    sandGrainTex.repeat.set(W*6, D*6);
    const floorMat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:1, bumpMap:sandGrainTex, bumpScale:0.0015});
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI/2;
    floor.position.set(0, 0, 0);
    floor.receiveShadow = true;
    scene.add(floor);
  }

  const glassMat = new THREE.MeshPhysicalMaterial({color:0xdff3fb, roughness:0.03, transparent:true, opacity:0.05, side:THREE.DoubleSide});
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(W, H), glassMat);
  glass.position.set(0, H/2, HALF_D);
  scene.add(glass);

  // black bezel frame around the tank
  const frameMat = new THREE.MeshStandardMaterial({color:0x111214, roughness:0.6});
  const bezelThick = 0.12;
  const frameParts = [
    [W+bezelThick*2, bezelThick, D+bezelThick*2, 0, -bezelThick/2 - 0.05, 0],
    [W+bezelThick*2, bezelThick, D+bezelThick*2, 0, H+bezelThick/2, 0],
  ];
  frameParts.forEach(([sx,sy,sz,x,y,z], i)=>{
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), frameMat);
    m.position.set(x,y,z);
    // the top bezel spans the whole tank lid — casting from it would block the
    // hood light and black out the interior, so it only receives
    m.castShadow = (i !== 1); m.receiveShadow = true;
    scene.add(m);
  });
  // vertical corner posts
  for(const cx of [-HALF_W-bezelThick/2, HALF_W+bezelThick/2]){
    for(const cz of [-HALF_D-bezelThick/2, HALF_D+bezelThick/2]){
      const post = new THREE.Mesh(new THREE.BoxGeometry(bezelThick,H+bezelThick*2,bezelThick), frameMat);
      post.position.set(cx, H/2, cz);
      scene.add(post);
    }
  }
  // stand beneath
  const standMat = new THREE.MeshStandardMaterial({color:0x2b1c14, roughness:0.85});
  const stand = new THREE.Mesh(new THREE.BoxGeometry(W+0.3, 0.9, D+0.2), standMat);
  stand.position.set(0, -0.7, 0);
  stand.receiveShadow = true;
  scene.add(stand);
}

// ---------------------------------------------------------------
// WATER SURFACE — an animated, reflective plane at the waterline
// ---------------------------------------------------------------
const WATER_SURFACE_Y = H - 0.08;
// finer in X than the tank's 18.6 width would suggest: ripple rings need enough
// samples across a wavefront or they alias into a jagged star
const waterGeo = new THREE.PlaneGeometry(W-0.04, D-0.04, 96, 28);
const waterBasePositions = waterGeo.attributes.position.array.slice(); // original flat positions, waves are added on top each frame
const waterMatOpts = {
  color: 0xbfe3ea, transparent: true, opacity: 0.32, roughness: 0.06,
  clearcoat: 1, clearcoatRoughness: 0.08, side: THREE.DoubleSide
};
if (sharedEnvMap){ waterMatOpts.envMap = sharedEnvMap; waterMatOpts.envMapIntensity = 1.1; }
const waterMat = new THREE.MeshPhysicalMaterial(waterMatOpts);
const waterSurface = new THREE.Mesh(waterGeo, waterMat);
waterSurface.rotation.x = -Math.PI/2;
waterSurface.position.set(0, WATER_SURFACE_Y, 0);
scene.add(waterSurface);
// Ripples left by fish breaking the surface. Each is an expanding wave packet:
// a ring of a few oscillations that travels outward, spreads thinner as its
// circumference grows, and decays away. The plane is rotated -90deg about X, so
// local (x, y) maps to world (x, -z) and the local Z we displace is world height.
const surfaceRipples = [];
const MAX_SURFACE_RIPPLES = 16;
function spawnSurfaceRipple(worldX, worldZ, amp, speed){
  if (surfaceRipples.length >= MAX_SURFACE_RIPPLES) surfaceRipples.shift();
  surfaceRipples.push({
    x: worldX, z: worldZ, age: 0,
    amp, speed,
    life: 0.9 + amp*55,          // bigger disturbances ring out longer
    // a single broad crest-and-trough rather than tight concentric rings — the
    // surface mesh can't resolve a short wavelength without aliasing
    width: 0.11 + amp*3.0,
    freq: 8.2 - amp*22
  });
}
function updateSurfaceRipples(dt){
  for(let i=surfaceRipples.length-1;i>=0;i--){
    const r = surfaceRipples[i];
    r.age += dt;
    if (r.age >= r.life) surfaceRipples.splice(i,1);
  }
}
function updateWaterSurface(t, dt){
  updateSurfaceRipples(dt);
  const pos = waterGeo.attributes.position;
  // per-ripple values that don't vary across the surface
  for(const r of surfaceRipples){
    r._front = r.speed*r.age;
    r._decay = r.amp * Math.pow(1 - r.age/r.life, 1.6) * Math.exp(-r.age*1.15);
    r._inv2w2 = 1/(2*r.width*r.width);
    r._cut = r.width*3;
  }
  for(let i=0;i<pos.count;i++){
    const bx = waterBasePositions[i*3], by = waterBasePositions[i*3+1];
    let wave = Math.sin(bx*1.1 + t*1.3)*0.012
             + Math.sin(by*1.7 - t*1.7)*0.009
             + Math.sin((bx+by)*0.6 + t*0.5)*0.006;
    if (surfaceRipples.length){
      const wz = -by; // local +Y points along world -Z
      for(const r of surfaceRipples){
        const dx = bx - r.x, dz = wz - r.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        const d = dist - r._front;
        if (d > r._cut || d < -r._cut) continue;      // outside the travelling packet
        const packet = Math.exp(-d*d*r._inv2w2);
        const spread = 1/(1 + dist*1.9);              // energy thins as the ring grows
        wave += Math.cos(d*r.freq) * packet * spread * r._decay;
      }
    }
    pos.setZ(i, wave);
  }
  pos.needsUpdate = true;
  waterGeo.computeVertexNormals();
}

// ---------------------------------------------------------------
// GRAVEL BED
// ---------------------------------------------------------------
{
  function makePebbleGeometry(radius, seed, stretch){
    const geo = new THREE.IcosahedronGeometry(radius, 2);
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for(let i=0;i<pos.count;i++){
      v.fromBufferAttribute(pos,i);
      const n = v.clone().normalize();
      const noise = Math.sin(n.x*9+seed)*Math.cos(n.y*8-seed*1.4)*0.4
                  + Math.sin(n.z*11-seed*0.8)*0.25;
      v.multiplyScalar(1+noise*0.16);
      v.x *= stretch[0]; v.y *= stretch[1]; v.z *= stretch[2];
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
    return geo;
  }
  const colors = [0xe6d9ad, 0xcdbb8a, 0xb8a476, 0xd0c49a, 0xc7ab8f, 0x9c8f74, 0xdcc9a3];
  const shapeKinds = [
    ()=>[0.6+Math.random()*0.5, 0.35+Math.random()*0.2, 0.6+Math.random()*0.5],   // flattish
    ()=>[0.9+Math.random()*0.4, 0.5+Math.random()*0.25, 0.45+Math.random()*0.3],  // elongated
    ()=>[0.55+Math.random()*0.3, 0.55+Math.random()*0.3, 0.55+Math.random()*0.3], // roundish
    ()=>[0.7+Math.random()*0.5, 0.45+Math.random()*0.3, 0.8+Math.random()*0.4],   // angular-ish wide
  ];
  const batches = 9;
  for(let batch=0; batch<batches; batch++){
    const col = colors[batch % colors.length];
    const shapeFn = shapeKinds[batch % shapeKinds.length];
    const mat = new THREE.MeshStandardMaterial({color:col, roughness:1});
    const count = Math.round(48 * (W/6.2) * 0.15);
    const mesh = new THREE.InstancedMesh(new THREE.BufferGeometry(), mat, count);
    // build one shared geometry per batch (distinct per batch, still varied instance-to-instance via transform)
    const baseR = 0.06+Math.random()*0.035;
    mesh.geometry = makePebbleGeometry(baseR, Math.random()*40, shapeFn());
    for(let i=0;i<count;i++){
      const buried = Math.random() < 0.75;
      const yBase = buried ? (-0.015+Math.random()*0.025) : (0.035+Math.random()*0.03);
      dummy.position.set((Math.random()-0.5)*(W-0.15), yBase, (Math.random()-0.5)*(D-0.15));
      dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
      const sc = (buried ? 0.7 : 0.55) + Math.random()*0.55;
      dummy.scale.set(sc, sc, sc);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
  }
}

// ---------------------------------------------------------------
// ROCKS
// ---------------------------------------------------------------
function hash3(x,y,z){
  const h = Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;
  return h - Math.floor(h);
}
function valueNoise3(x,y,z){
  const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  const xf=x-xi, yf=y-yi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf), w=zf*zf*(3-2*zf);
  const lerp=(a,b,t)=>a+(b-a)*t;
  const c000=hash3(xi,yi,zi), c100=hash3(xi+1,yi,zi), c010=hash3(xi,yi+1,zi), c110=hash3(xi+1,yi+1,zi);
  const c001=hash3(xi,yi,zi+1), c101=hash3(xi+1,yi,zi+1), c011=hash3(xi,yi+1,zi+1), c111=hash3(xi+1,yi+1,zi+1);
  const x00=lerp(c000,c100,u), x10=lerp(c010,c110,u), x01=lerp(c001,c101,u), x11=lerp(c011,c111,u);
  const y0=lerp(x00,x10,v), y1=lerp(x01,x11,v);
  return lerp(y0,y1,w);
}
function fbm3(x,y,z,octaves){
  let total=0, amp=0.5, freq=1, sum=0;
  for(let i=0;i<octaves;i++){
    total += valueNoise3(x*freq,y*freq,z*freq)*amp;
    sum += amp;
    amp*=0.52; freq*=2.15;
  }
  return total/sum; // roughly 0..1
}
function makeGrainTexture(size, freq, seed, octaves){
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const imgData = ctx.createImageData(size, size);
  for(let y=0; y<size; y++){
    for(let x=0; x<size; x++){
      const n = fbm3(x*freq, y*freq, seed, octaves);
      const v = Math.floor(THREE.MathUtils.clamp(n, 0, 1)*255);
      const idx = (y*size+x)*4;
      imgData.data[idx] = v; imgData.data[idx+1] = v; imgData.data[idx+2] = v; imgData.data[idx+3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = maxAnisotropy; // keeps the gravel sharp at grazing angles
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  return tex;
}
const rockGrainTexture = makeGrainTexture(128, 0.35, 22.7, 3);
const fishScaleTexture = makeGrainTexture(128, 0.9, 41.2, 2);

// A tileable NORMAL map of overlapping shingle scales. Scales live entirely in
// this texture now — the body mesh no longer tries to displace one bump per
// vertex, which is what made large fish look knitted. Each scale overlaps its
// neighbours (radii > half a cell, resolved by taking the max over the 3x3
// neighbourhood), so they read as shingles with creases where they meet rather
// than as isolated beads. rows must be even for the half-row stagger to tile.
const SCALE_TEX_ROWS = 12, SCALE_TEX_COLS = 12;
function makeScaleNormalTexture(size){
  const height = new Float32Array(size*size);
  const RX = 0.80, RY = 0.68; // >0.5, so adjacent scales overlap
  for(let y=0; y<size; y++){
    for(let x=0; x<size; x++){
      const u = x/size, v = y/size;
      const rowPos = u*SCALE_TEX_ROWS, colPosRaw = v*SCALE_TEX_COLS;
      let best = 0;
      for(let dr=-1; dr<=1; dr++){
        const row = Math.floor(rowPos)+dr;
        const cellRow = row + 0.5;
        const colPos = colPosRaw + (((row%2)+2)%2)*0.5; // stagger alternate rows
        for(let dc=-1; dc<=1; dc++){
          const cellCol = Math.floor(colPos)+dc+0.5;
          const dx = (rowPos-cellRow)/RX, dy = (colPos-cellCol)/RY;
          const d = Math.sqrt(dx*dx + dy*dy);
          if (d >= 1) continue;
          // plateau across the body of the scale, falling off only near its rim,
          // so overlapping scales meet in a crease instead of blending to mush
          const t = 1 - smooth01(0.45, 1.0, d);
          // the exposed (trailing) edge sits slightly proud, as on a real scale
          const lip = Math.exp(-Math.pow((d-0.72)/0.16, 2)) * 0.22;
          best = Math.max(best, t*0.85 + lip);
        }
      }
      height[y*size+x] = best;
    }
  }
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  const at = (x,y)=> height[((y+size)%size)*size + ((x+size)%size)];
  const strength = size*0.020;
  for(let y=0; y<size; y++){
    for(let x=0; x<size; x++){
      const gx = (at(x+1,y)-at(x-1,y))*strength;
      const gy = (at(x,y+1)-at(x,y-1))*strength;
      let nx = -gx, ny = -gy, nz = 1;
      const inv = 1/Math.sqrt(nx*nx+ny*ny+nz*nz);
      nx*=inv; ny*=inv; nz*=inv;
      const idx = (y*size+x)*4;
      img.data[idx]   = Math.round((nx*0.5+0.5)*255);
      img.data[idx+1] = Math.round((ny*0.5+0.5)*255);
      img.data[idx+2] = Math.round((nz*0.5+0.5)*255);
      img.data[idx+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = maxAnisotropy;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  return tex;
}
// 512px over a 12x12 grid gives each scale ~42px, enough to read as a scale
// rather than a stitch
const scaleNormalTexture = makeScaleNormalTexture(512);
// how many scales per world unit — density is now a property of the fish's real
// size, not of its mesh resolution, so a discus gets many small scales instead of
// a few large ones stretched over its flank
const SCALES_PER_UNIT = 105;
fishScaleTexture.repeat.set(6, 3);
rockGrainTexture.repeat.set(8,8);
function makeRockGeometry(radius, seed, flattenBottom){
  const geo = new THREE.IcosahedronGeometry(radius, 12);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  const colors = [];
  const baseCol = new THREE.Color(0x6a7378);
  const darkCol = new THREE.Color(0x2b3134);
  const mossDarkCol = new THREE.Color(0x3c5c2e);
  const mossLightCol = new THREE.Color(0x7a9c4a);
  const lichenCol = new THREE.Color(0x8a9070);
  const lichenBrightCol = new THREE.Color(0xc9a13a);
  const rustCol = new THREE.Color(0x6b4a34);
  const veinCol = new THREE.Color(0xcac4b2);
  const sx=seed*3.7, sy=seed*7.1, sz=seed*1.9;
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i);
    const n = v.clone().normalize();

    const big = fbm3(n.x*1.1+sx, n.y*1.1+sy, n.z*1.1+sz, 3) - 0.5;

    // fine grain texture
    const fine = fbm3(n.x*15+sx, n.y*15+sy, n.z*15+sz, 2) - 0.5;
    // micro grain — only meaningful at this vertex density; adds pitting/granularity
    const micro = fbm3(n.x*28+sx, n.y*28+sy, n.z*28+sz, 2) - 0.5;
    let bump = 1 + big*0.4 + mid*0.16 + fine*0.05 + micro*0.018;

    // detect lichen/moss patches before finalizing position, so they can add real crusty texture
    let patchT = 0, toneNoise = 0;
    if (n.y > 0.3){
      const mossPatch = fbm3(n.x*4.5+sx*2, n.y*4.5+sy*2, n.z*4.5+sz*2, 3);
      const speckle = fbm3(n.x*13+sx*1.3, n.y*13+sy*1.3, n.z*13+sz*1.3, 2); // finer secondary patchiness
      const patchSignal = mossPatch*0.7 + speckle*0.3;
      if (patchSignal > 0.44){

        toneNoise = fbm3(n.x*3+sx*3.3, n.y*3+sy*3.3, n.z*3+sz*3.3, 2);

    v.multiplyScalar(bump);
    if (flattenBottom && v.y < -radius*flattenBottom){

    pos.setXYZ(i, v.x, v.y, v.z);
    const crevice = THREE.MathUtils.clamp((bump-0.82)/0.5, 0, 1);
    let col = darkCol.clone().lerp(baseCol, crevice);

    const rustNoise = fbm3(n.x*2.2+sx*1.7, n.y*4.5+sy*1.7, n.z*2.2+sz*1.7, 3);
    if (rustNoise > 0.6) col.lerp(rustCol, Math.min(0.55, (rustNoise-0.6)*1.9));

    const veinNoise = fbm3(n.x*5+sx*2.3, n.y*5+sy*2.3, n.z*5+sz*2.3, 2);
    if (veinNoise > 0.71 && veinNoise < 0.75) col.lerp(veinCol, 0.65);

      if (toneNoise < 0.3) target = mossDarkCol;

      else if (toneNoise < 0.85) target = lichenCol;
      else target = lichenBrightCol; // occasional bright yellow-orange accent, common on real rock lichen
      col.lerp(target, patchT*0.75);

      col.multiplyScalar(1 + (fleck-0.5)*0.18);

  geo.computeVertexNormals();

}

  const q = rock.quaternion;
  const invQuat = new THREE.Quaternion(-q.x, -q.y, -q.z, q.w); // conjugate = inverse for a unit quaternion; avoids relying on .invert()/.inverse() naming
  for(let i=0;i<tuftCount;i++){
    const theta = Math.random()*Math.PI*2;
    const phi = Math.random()*Math.PI*0.42; // small cone around world-up, so moss lands on top faces regardless of the rock's random rotation
    const worldDir = new THREE.Vector3(Math.sin(phi)*Math.cos(theta), Math.cos(phi), Math.sin(phi)*Math.sin(theta));
    const localDir = worldDir.applyQuaternion(invQuat);
    const pos = localDir.multiplyScalar(radius*0.97);
    const tuftGeo = new THREE.SphereGeometry(radius*0.2*(0.7+Math.random()*0.7), 5, 4);

  const discCount = 4+Math.floor(radius*12)+Math.floor(Math.random()*4);
  for(let i=0;i<discCount;i++){
    const theta = Math.random()*Math.PI*2;
    const phi = Math.random()*Math.PI*0.55; // lichen grows across a broader area than the moss tufts
    const worldDir = new THREE.Vector3(Math.sin(phi)*Math.cos(theta), Math.cos(phi), Math.sin(phi)*Math.sin(theta));
    const localDir = worldDir.applyQuaternion(invQuat).normalize();
    const pos = localDir.clone().multiplyScalar(radius*0.985);
    const discR = radius*0.13*(0.6+Math.random()*0.9);
    const discGeo = new THREE.CylinderGeometry(discR, discR*0.8, radius*0.025, 7);
    const disc = new THREE.Mesh(discGeo, lichenDiscMats[Math.floor(Math.random()*lichenDiscMats.length)]);
    disc.position.copy(pos);

function makeStratifiedRockGeometry(radius, seed, palette){
  palette = palette || { light:0xd9c6a3, mid:0xbaa178, dark:0x8c7456, accent:0xa87a4a };
  const geo = new THREE.IcosahedronGeometry(radius, 12);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  const colors = [];
  const beigeLight = new THREE.Color(palette.light);
  const beigeMid = new THREE.Color(palette.mid);
  const beigeDark = new THREE.Color(palette.dark);
  const rustCol = new THREE.Color(palette.accent);
  const sx=seed*3.7, sy=seed*7.1, sz=seed*1.9;
  const layerFreq = 9 + (Math.floor(seed)%4);
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i);
    const n = v.clone().normalize();
    const big = fbm3(n.x*1.1+sx, n.y*1.1+sy, n.z*1.1+sz, 3) - 0.5;
    const mid = fbm3(n.x*3.2+sx, n.y*3.2+sy, n.z*3.2+sz, 3) - 0.5;
    const fine = fbm3(n.x*15+sx, n.y*15+sy, n.z*15+sz, 2) - 0.5;
    let bump = 1 + big*0.32 + mid*0.13 + fine*0.04; // flatter overall than the igneous rock variant

    // horizontal stratification — stepped layers with a visible fracture line at each boundary,
    // like an eroded sedimentary rock face
    const layerPos = v.y/radius * layerFreq;
    const layerIdx = Math.floor(layerPos);
    const layerFrac = layerPos - layerIdx;
    const layerStep = fbm3(layerIdx*4.3+sx, 7.7, 0, 2) - 0.5;
    const edgeSharp = Math.pow(Math.abs(layerFrac-0.5)*2, 3);
    bump += layerStep*0.05*(1-edgeSharp*0.4);

    v.multiplyScalar(bump);
    pos.setXYZ(i, v.x, v.y, v.z);

    const crevice = THREE.MathUtils.clamp((bump-0.86)/0.4, 0, 1);
    const layerTone = fbm3(layerIdx*9.1+sx*0.7, 3.3, 0, 2);
    const base = beigeDark.clone().lerp(beigeLight, layerTone);
    const col = base.clone().lerp(beigeMid, 1-crevice);
    const rustNoise = fbm3(n.x*2.4+sx*1.6, n.y*5+sy*1.6, n.z*2.4+sz*1.6, 3);
    if (rustNoise > 0.62) col.lerp(rustCol, Math.min(0.5, (rustNoise-0.62)*1.8));
    if (edgeSharp > 0.75) col.multiplyScalar(0.82); // darken right at the fracture lines
    colors.push(col.r, col.g, col.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
  geo.computeVertexNormals();
  return geo;
}

// Leaf vein normal map — a raised midrib with lateral veins branching off it,
// shared by every blade. u runs across the blade, v runs from base to tip.
function makeLeafVeinNormalTexture(size){
  const h = new Float32Array(size*size);
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const u = x/size, v = y/size;
      const across = (u-0.5)*2;                                  // -1 edge .. 0 midrib .. 1 edge
      const mid = Math.exp(-Math.pow(across/0.11, 2)) * (1-v*0.45);
      // lateral veins sweep out and up from the midrib, more crowded near the tip
      const sweep = v*26 - Math.abs(across)*6.5;
      const lateral = Math.pow(Math.max(0, Math.sin(sweep)), 14) * (1-Math.exp(-Math.pow(across/0.16,2))) * 0.5;
      h[y*size+x] = mid + lateral;
    }
  }
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  const at = (x,y)=> h[Math.min(size-1,Math.max(0,y))*size + Math.min(size-1,Math.max(0,x))];
  const strength = size*0.05;
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const gx = (at(x+1,y)-at(x-1,y))*strength;
      const gy = (at(x,y+1)-at(x,y-1))*strength;
      let nx=-gx, ny=-gy, nz=1;
      const inv = 1/Math.sqrt(nx*nx+ny*ny+nz*nz);
      const idx = (y*size+x)*4;
      img.data[idx]   = Math.round((nx*inv*0.5+0.5)*255);
      img.data[idx+1] = Math.round((ny*inv*0.5+0.5)*255);
      img.data[idx+2] = Math.round((nz*inv*0.5+0.5)*255);
      img.data[idx+3] = 255;
    }
  }
  ctx.putImageData(img,0,0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = maxAnisotropy;
  return tex;
}

// Blades bend in the vertex shader instead of rotating rigidly about their base,
// which lets them stay instanced (one draw call per variant) while still flexing
// progressively along their length. A single time uniform drives every plant, and
// the per-instance phase encodes world X so a current visibly travels down the tank.
const plantSwayUniform = { value: 0 };
function patchPlantSway(material){
  material.onBeforeCompile = (shader)=>{
    shader.uniforms.uTime = plantSwayUniform;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uTime;
        attribute float aPhase;
        attribute float aStiff;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float swayH = clamp(transformed.y, 0.0, 1.0);
        float swayAmt = swayH*swayH*aStiff;
        float wave = sin(uTime*1.05 + aPhase) + 0.34*sin(uTime*2.27 + aPhase*1.7);
        transformed.x += wave*swayAmt*0.20;
        transformed.z += wave*swayAmt*0.07;
        transformed.y -= abs(wave)*swayAmt*swayAmt*0.06; // the tip arcs over rather than stretching
      `);
  };
  material.customProgramCacheKey = ()=>'plant-sway';

// arrives as instanceColor.
const BLADE_COLS = 5;
function makeBladeGeometry(seed, segs, curveAmt, foldDepth, taper){
  segs = segs || 16;
  const positions = [], indices = [], uvs = [], colors = [], normalsSeed = [];
  for(let i=0;i<=segs;i++){
    const h = i/segs;
    const w = (1-h*taper)*0.5;
    const wave = Math.sin(h*7+seed)*0.05;                       // gentle lengthwise waviness
    const edgeRipple = Math.sin(h*17+seed*2.3)*0.035;           // ripple along the leaf edge
    const bend = Math.sin(h*Math.PI*0.5)*curveAmt;
    for(let c=0;c<BLADE_COLS;c++){
      const t = c/(BLADE_COLS-1);                                // 0 = left edge, 1 = right edge
      const across = (t-0.5)*2;
      const x = across*w + wave + Math.abs(across)*edgeRipple;
      const z = bend - (1-across*across)*w*foldDepth;            // U-shaped fold, deepest at the midrib
      positions.push(x, h, z);
      uvs.push(t, h);
      // AO into the base, brighter toward the tip, midrib catches a little more light
      const ao = 0.52 + 0.48*smooth01(0.0, 0.42, h);
      const tipLift = 1 + Math.pow(h,1.4)*0.42;

      colors.push(v, v*1.02, v*0.96);                            // a touch cooler at the base
      normalsSeed.push(0);
    }
  }
  for(let i=0;i<segs;i++){
    for(let c=0;c<BLADE_COLS-1;c++){
      const a = i*BLADE_COLS+c, b = a+1, d = a+BLADE_COLS, e = d+1;
      indices.push(a, d, b, b, d, e);

  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));

}

const swayingPlants = [];

const plantColorScratch = new THREE.Color();
function pushBlade(variant, matrix, colorHex, stiff, worldX){
  const col = plantColorScratch.set(colorHex);
  const hsl = {h:0,s:0,l:0};
  col.getHSL(hsl);
  col.setHSL(                                                    // per-plant color jitter
    (hsl.h + (Math.random()-0.5)*0.035 + 1) % 1,
    THREE.MathUtils.clamp(hsl.s*(0.80+Math.random()*0.35), 0, 1),
    THREE.MathUtils.clamp(hsl.l*(0.82+Math.random()*0.36), 0.03, 0.9)
  );
  if (Math.random() < 0.12) col.lerp(new THREE.Color(0xb0a24a), 0.25+Math.random()*0.3); // older, yellowed leaves
  if (Math.random() < 0.10) col.lerp(new THREE.Color(0x24301c), 0.2+Math.random()*0.25); // algae-dusted
  bladeInstances[variant].push({
    matrix: matrix.clone(),
    color: col.clone(),
    stiff,
    phase: worldX*0.85 + Math.random()*0.9                        // world X => travelling wave
  });
}
function plantCluster(cx, cz, count, heightRange, colorOpts){

  for(let i=0;i<count;i++){
    const h = heightRange[0] + Math.random()*(heightRange[1]-heightRange[0]);
    const col = colorOpts[Math.floor(Math.random()*colorOpts.length)];
    const w = 0.09+Math.random()*0.05;
    const x = cx+(Math.random()-0.5)*0.7, z = cz+(Math.random()-0.5)*0.5;
    dummy.position.set(x, 0, z);
    dummy.rotation.set((Math.random()-0.5)*0.12, Math.random()*Math.PI*2, (Math.random()-0.5)*0.18);
    dummy.scale.set(w, h, w);
    dummy.updateMatrix();
    pushBlade(Math.floor(Math.random()*BLADE_VARIANTS.length), dummy.matrix, col, 0.9+Math.random()*0.5, x);
  }
}
// a fuller crown plant (sword-plant style): broader leaves splaying outward from one base point
function plantRosette(cx, cz, leafCount, heightRange, colorOpts, widthMult){
  widthMult = widthMult || 1;
  leafCount = Math.round(leafCount*1.6);
  for(let i=0;i<leafCount;i++){
    const h = heightRange[0] + Math.random()*(heightRange[1]-heightRange[0]);
    const col = colorOpts[Math.floor(Math.random()*colorOpts.length)];
    const w = (0.15+Math.random()*0.08)*widthMult;
    dummy.position.set(cx, 0, cz);
    dummy.rotation.set(0, (i/leafCount)*Math.PI*2 + Math.random()*0.4, -0.28-Math.random()*0.3);
    dummy.scale.set(w, h, w);
    dummy.updateMatrix();
    pushBlade(Math.floor(Math.random()*BLADE_VARIANTS.length), dummy.matrix, col, 0.35+Math.random()*0.25, cx);

}
function buildBladeMeshes(){
  const built = [];
  bladeInstances.forEach((list, vi)=>{
    if (!list.length) return;
    const geo = BLADE_VARIANTS[vi].clone();
    const phases = new Float32Array(list.length), stiffs = new Float32Array(list.length);
    list.forEach((b,i)=>{ phases[i] = b.phase; stiffs[i] = b.stiff; });
    geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases,1));
    geo.setAttribute('aStiff', new THREE.InstancedBufferAttribute(stiffs,1));
    const mat = new THREE.MeshPhysicalMaterial({
      vertexColors:true, roughness:0.58, metalness:0, side:THREE.DoubleSide,
      normalMap: leafVeinNormalTexture, normalScale: new THREE.Vector2(0.5,0.5),
      transparent:true, opacity:0.97, transmission:0.3, ior:1.34,   // thin leaves glow when backlit
      sheen: new THREE.Color(0x9ec48a), clearcoat:0.18, clearcoatRoughness:0.5
    });
    if (sharedEnvMap){ mat.envMap = sharedEnvMap; mat.envMapIntensity = 0.5; }
    patchPlantSway(mat);
    const mesh = new THREE.InstancedMesh(geo, mat, list.length);
    list.forEach((b,i)=>{ mesh.setMatrixAt(i, b.matrix); mesh.setColorAt(i, b.color); });
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.castShadow = true; mesh.receiveShadow = true;
    // the shadow pass needs the same vertex bend, or shadows detach from the leaves
    const depthMat = new THREE.MeshDepthMaterial({depthPacking: THREE.RGBADepthPacking});
    patchPlantSway(depthMat);
    mesh.customDepthMaterial = depthMat;
    mesh.frustumCulled = false; // instances are spread tank-wide; the shared bounds would cull wrongly
    scene.add(mesh);
    built.push(mesh);
  });
  return built;
}
// Broad, glossy paddle leaves (Anubias/crypt style) — low taper, deep cupped

const paddleInstances = PADDLE_VARIANTS.map(()=>[]);
function pushPaddle(variant, matrix, colorHex, stiff, worldX){

// Anubias/crypt-style plant: a handful of broad leaves on individual petioles
// rising from a horizontal rhizome, rather than a single basal crown — the
// leaves stay stiffer and more upright than the strap plants around them.
function plantAnubias(cx, cz, leafCount, heightRange, colorOpts){
  const rhizomeLen = 0.12+Math.random()*0.1;
  const rhizomeAng = Math.random()*Math.PI*2;
  const rhizomeMat = new THREE.MeshStandardMaterial({color:0x3d5a3a, roughness:0.8});
  const rhizome = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.014,rhizomeLen,7), rhizomeMat);
  rhizome.rotation.z = Math.PI/2; rhizome.rotation.y = rhizomeAng;
  rhizome.position.set(cx, 0.02, cz);
  rhizome.castShadow = true; rhizome.receiveShadow = true;
  scene.add(rhizome);
  for(let i=0;i<leafCount;i++){
    const along = (i+0.5)/leafCount - 0.5;
    const bx = cx + Math.cos(rhizomeAng)*along*rhizomeLen;
    const bz = cz + Math.sin(rhizomeAng)*along*rhizomeLen;
    const h = heightRange[0] + Math.random()*(heightRange[1]-heightRange[0]);
    const petioleH = h*(0.4+Math.random()*0.15);
    const leanAng = Math.random()*Math.PI*2, lean = 0.12+Math.random()*0.15;
    const petioleMat = new THREE.MeshStandardMaterial({color:0x3d6a3f, roughness:0.75});
    const petiole = new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.009,petioleH,6), petioleMat);
    petiole.position.set(bx + Math.cos(leanAng)*lean*petioleH*0.5, petioleH/2, bz + Math.sin(leanAng)*lean*petioleH*0.5);
    petiole.rotation.set(Math.cos(leanAng)*lean, 0, -Math.sin(leanAng)*lean);
    petiole.castShadow = true; petiole.receiveShadow = true;
    scene.add(petiole);
    const tipX = bx + Math.cos(leanAng)*lean*petioleH, tipZ = bz + Math.sin(leanAng)*lean*petioleH;
    const leafH = h - petioleH, leafW = 0.34+Math.random()*0.16;
    dummy.position.set(tipX, petioleH, tipZ);
    dummy.rotation.set(Math.cos(leanAng)*lean*0.6, Math.random()*Math.PI*2, -Math.sin(leanAng)*lean*0.6);
    dummy.scale.set(leafW, leafH, leafW);
    dummy.updateMatrix();
    const col = colorOpts[Math.floor(Math.random()*colorOpts.length)];
    pushPaddle(Math.floor(Math.random()*PADDLE_VARIANTS.length), dummy.matrix, col, 0.5+Math.random()*0.2, tipX);
  }
}

// Delicate pondweed (hornwort/Ceratophyllum style) — thin forking stems dense
// with hair-thin needle leaflets in tight whorls. Much sparser stiffness than
// the other stem plants, so it billows visibly rather than just flexing.
function pondweedStem(cx, cz, dir, length, depth, colorOpts, worldXBase){
  const col = colorOpts[Math.floor(Math.random()*colorOpts.length)];
  const leafGeo = BLADE_VARIANTS[Math.floor(Math.random()*BLADE_VARIANTS.length)];
  const leafMat = makeLeafMaterial(col, 0.5);
  leafMat.transmission = 0.55; leafMat.opacity = 0.9; leafMat.roughness = 0.4; // thread-thin, lets light through readily
  const whorls = Math.max(8, Math.round(length*34));
  const leafletsPerWhorl = 7;
  const leaves = new THREE.InstancedMesh(leafGeo, leafMat, whorls*leafletsPerWhorl);
  let idx = 0;
  for(let w=0; w<whorls; w++){
    const hFrac = w/whorls;
    const y = hFrac*length;
    for(let l=0;l<leafletsPerWhorl;l++){
      const ang = (l/leafletsPerWhorl)*Math.PI*2 + hFrac*5.5;
      dummy.position.set(0,y,0);
      dummy.rotation.set(Math.PI/2-0.15, ang, 0);
      const sc = 1-hFrac*0.3;
      dummy.scale.set(0.005*sc, 0.032*sc, 0.005*sc); // thread-thin — a fraction of the feathery plant's leaflet width
      dummy.updateMatrix();
      leaves.setMatrixAt(idx++, dummy.matrix);
    }
  }
  leaves.instanceMatrix.needsUpdate = true;
  leaves.castShadow = true; leaves.receiveShadow = true;
  const stemMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.003,0.005,length,6), new THREE.MeshStandardMaterial({color:0x3a5c34, roughness:0.6}));
  stemMesh.castShadow = true; stemMesh.receiveShadow = true;
  stemMesh.position.y = length/2;
  const group = new THREE.Group();
  group.add(stemMesh, leaves);
  group.position.set(cx, 0, cz);
  group.rotation.z = dir.z; group.rotation.x = dir.x;
  scene.add(group);
  swayingPlants.push({mesh: group, phase: Math.random()*2.5, amp: 0.09+Math.random()*0.05, baseRotZ: dir.z, worldX: worldXBase});
  // one level of forking partway up — a second, shorter stem branching off,
  // which is what gives hornwort its bushy, tangled silhouette
  if (depth > 0 && length > 0.25){
    const forkFrac = 0.55+Math.random()*0.25;
    const forkLen = length*(0.4+Math.random()*0.25);
    const forkDir = {x: dir.x+(Math.random()-0.5)*0.5, z: dir.z+(Math.random()-0.5)*0.6};
    // approximate the fork's base position from the parent's lean, good enough at this scale
    const fx = cx + Math.sin(dir.z)*length*forkFrac, fz = cz + Math.sin(dir.x)*length*forkFrac*0.4;
    pondweedStem(fx, fz, forkDir, forkLen, depth-1, colorOpts, worldXBase);
  }
}
function plantPondweed(cx, cz, stemCount, heightRange, colorOpts){
  for(let s=0; s<stemCount; s++){
    const length = heightRange[0] + Math.random()*(heightRange[1]-heightRange[0]);
    const x = cx+(Math.random()-0.5)*0.5, z = cz+(Math.random()-0.5)*0.4;
    const dir = {x:(Math.random()-0.5)*0.1, z:(Math.random()-0.5)*0.16};
    pondweedStem(x, z, dir, length, 1, colorOpts, x);
  }
}

// feathery/bushy stem plant (like Cabomba/Myriophyllum) — whorls of thin leaflets around a central stem.
// opts lets a call ask for a denser, more columnar specimen (like a plastic aquarium
// ornament plant) without disturbing the sparser look used elsewhere.
function plantFeathery(cx, cz, stemCount, heightRange, colorOpts, opts){
  opts = opts || {};
  const leafletsPerWhorl = opts.leafletsPerWhorl || 5;
  const whorlDensity = opts.whorlDensity || 9;     // whorls per unit height
  const leafletScale = opts.leafletScale || 1;
  const taper = opts.taper===undefined ? 0.35 : opts.taper; // how much the whorl radius shrinks toward the tip
  const baseWidthMul = opts.baseWidthMul || 1;
  for(let s=0; s<stemCount; s++){
    const stemH = heightRange[0] + Math.random()*(heightRange[1]-heightRange[0]);
    const col = colorOpts[Math.floor(Math.random()*colorOpts.length)];
    const leafGeo = BLADE_VARIANTS[Math.floor(Math.random()*BLADE_VARIANTS.length)];
    const leafMat = makeLeafMaterial(col, 0.7);
    const whorls = Math.max(6, Math.min(26, Math.round(stemH*whorlDensity)));
    const leaves = new THREE.InstancedMesh(leafGeo, leafMat, whorls*leafletsPerWhorl);
    let idx = 0;
    for(let w=0; w<whorls; w++){
      const hFrac = w/whorls;
      const y = hFrac*stemH;
      for(let l=0;l<leafletsPerWhorl;l++){
        const ang = (l/leafletsPerWhorl)*Math.PI*2 + hFrac*3.5;
        dummy.position.set(0,y,0);
        dummy.rotation.set(Math.PI/2-0.25, ang, 0);
        const sc = (1-hFrac*taper) * leafletScale * (1 + (1-hFrac)*(baseWidthMul-1));
        dummy.scale.set(0.012*sc, 0.06*sc, 0.012*sc); // blade geometry is normalized, so scale sets the leaflet size
        dummy.updateMatrix();
        leaves.setMatrixAt(idx++, dummy.matrix);
      }
    }
    leaves.instanceMatrix.needsUpdate = true;
    leaves.castShadow = true; leaves.receiveShadow = true;
    const stemMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.01,stemH,10), new THREE.MeshStandardMaterial({color:col, roughness:0.7}));
    stemMesh.castShadow = true; stemMesh.receiveShadow = true;
    stemMesh.position.y = stemH/2;
    const group = new THREE.Group();
    group.add(stemMesh, leaves);
    group.position.set(cx+(Math.random()-0.5)*0.5, 0, cz+(Math.random()-0.5)*0.4);
    group.rotation.y = Math.random()*Math.PI*2;
    scene.add(group);
    swayingPlants.push({mesh: group, phase: Math.random()*2.5, amp: 0.045+Math.random()*0.03, baseRotZ: 0, worldX: group.position.x});
  }
}
// small-leafed stem plant (like Rotala/Ludwigia) — paired oval leaves spiraling up a stem, often reddish
// delicate fern — several flat fronds fanning from a base, each with many tiny paired leaflets
// arranged along a gentle curve (a lacy, flat pinnate structure, unlike a stem plant's spiral)
function plantFern(cx, cz, frondCount, heightRange, colorOpts){
  for(let f=0; f<frondCount; f++){
    const frondH = heightRange[0] + Math.random()*(heightRange[1]-heightRange[0]);
    const col = colorOpts[Math.floor(Math.random()*colorOpts.length)];
    const leafGeo = new THREE.SphereGeometry(0.013, 7, 6);
    const leafMat = makeLeafMaterial(col, 0.6, false); // sphere leaflets carry no vertex colors
    const pairs = Math.max(7, Math.round(frondH*26));
    const leaves = new THREE.InstancedMesh(leafGeo, leafMat, pairs*2);
    let idx = 0;
    const curveAmt = 0.12+Math.random()*0.15;
    for(let p=0;p<pairs;p++){
      const hFrac = p/pairs;
      const y = hFrac*frondH;
      const bend = Math.sin(hFrac*Math.PI*0.5)*curveAmt;
      const leafletLen = 0.03*(1-hFrac*0.5);
      [-1,1].forEach(side=>{
        dummy.position.set(side*leafletLen, y, bend);
        dummy.rotation.set(0, 0, side*(0.5+hFrac*0.3));
        const sc = 0.8+Math.random()*0.3;
        dummy.scale.set(sc*1.6, sc*0.5, sc*0.5);
        dummy.updateMatrix();
        leaves.setMatrixAt(idx++, dummy.matrix);
      });
    }
    leaves.instanceMatrix.needsUpdate = true;
    leaves.castShadow = true; leaves.receiveShadow = true;
    const stemMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.005,0.009,frondH,8), new THREE.MeshStandardMaterial({color:0x2c4a28, roughness:0.7}));
    stemMesh.castShadow = true; stemMesh.receiveShadow = true;
    stemMesh.position.y = frondH/2;
    const group = new THREE.Group();
    group.add(stemMesh, leaves);
    const tilt = 0.15+Math.random()*0.2;
    group.position.set(cx+(Math.random()-0.5)*0.3, 0, cz+(Math.random()-0.5)*0.25);
    group.rotation.y = (f/frondCount)*Math.PI*2 + Math.random()*0.3;
    group.rotation.z = -tilt; // gentle outward arch from the crown, like a real fern frond
    scene.add(group);
    swayingPlants.push({mesh: group, phase: Math.random()*2.5, amp: 0.035+Math.random()*0.02, baseRotZ: -tilt, worldX: group.position.x});
  }
}

    leafletsPerWhorl:8, whorlDensity:15, leafletScale:1.35, taper:0.22, baseWidthMul:1.15
  });
});

// every blade collected above becomes one InstancedMesh per shape variant
const bladeMeshes = buildBladeMeshes();
const paddleMeshes = buildPaddleMeshes();

// tiny oxygen-pearl specks clinging to the leaves, as on real planted tanks

function updatePlants(t){
  // blades bend on the GPU — one uniform drives all of them
  plantSwayUniform.value = t;
  // stem plants (feathery, fern) still arch from the base, but off the same
  // travelling wave so the whole planting moves as one current
  swayingPlants.forEach(({mesh, phase, amp, baseRotZ, worldX})=>{
    const wave = Math.sin(t*1.05 + (worldX||0)*0.85 + phase) + 0.34*Math.sin(t*2.27 + phase*1.7);
    mesh.rotation.z = (baseRotZ||0) + wave*amp*0.5;
  });
}

// ---------------------------------------------------------------
// FISH — smooth tapered ring-lofted bodies, a few charming species
// ---------------------------------------------------------------
// Fish at or above this body length keep the original eye build; smaller ones get
// the layered limbal-ring/cornea version. Species lengths run 0.08–0.50.
const EYE_DETAIL_MAX_LENGTH = 0.22;

function makeDetailedFinGeometry(pts, baseColorHex, opts){
  opts = opts || {};
  const uSteps = opts.uSteps || 11;
  const base = pts[0];
  const boundary = pts.slice(1);
  const vCount = boundary.length;
  const vSteps = opts.vSteps || Math.round((vCount-1)*4.5);
  const rayCount = opts.rayCount===undefined ? 5 : opts.rayCount;
  const billow = opts.billow===undefined ? 1 : opts.billow;
  const baseCol = new THREE.Color(baseColorHex);
  {
    const hsl = {h:0,s:0,l:0};
    baseCol.getHSL(hsl);
    baseCol.setHSL(hsl.h, Math.min(1, hsl.s*1.1), hsl.l);
  }
  const rayCol = baseCol.clone().multiplyScalar(0.55);
  const tipCol = baseCol.clone().lerp(new THREE.Color(0xffffff), 0.32);

  function boundaryAt(vFrac){
    const scaled = vFrac*(vCount-1);
    const seg = Math.min(vCount-2, Math.floor(scaled));
    const segFrac = scaled-seg;
    const p0 = boundary[seg], p1 = boundary[seg+1];
    return [
      p0[0]+(p1[0]-p0[0])*segFrac,
      p0[1]+(p1[1]-p0[1])*segFrac,
      p0[2]+(p1[2]-p0[2])*segFrac
    ];
  }

  const positions = [], colors = [];
  for(let ui=0; ui<=uSteps; ui++){
    const u0 = ui/uSteps;
    for(let vi=0; vi<=vSteps; vi++){
      const v = vi/vSteps;
      const rayPhase = Math.abs(Math.sin(v*Math.PI*rayCount));
      // trailing edge is scalloped: the membrane between rays falls short of the ray tips
      const u = u0 * (1 - 0.075*(1-rayPhase)*u0);
      const b = boundaryAt(v);
      const x = base[0]+(b[0]-base[0])*u;
      const y = base[1]+(b[1]-base[1])*u;
      let z = base[2]+(b[2]-base[2])*u;
      z += Math.sin(v*Math.PI)*0.012*u*billow; // gentle natural curvature, strongest at the tip
      z += (1-rayPhase)*0.004*u*billow;        // membrane bows between the stiffer rays
      positions.push(x,y,z);
      const rayDark = Math.pow(1-rayPhase,3) * u; // ray lines fade in from base to tip, not at the root
      const col = baseCol.clone().lerp(rayCol, rayDark*0.6);
      col.lerp(tipCol, u*u*0.32); // pales toward the tip — a stylized translucency cue
      colors.push(col.r, col.g, col.b);
    }
  }
  const indices = [];
  for(let ui=0; ui<uSteps; ui++){
    for(let vi=0; vi<vSteps; vi++){
      const a = ui*(vSteps+1)+vi, b2 = a+1, c = a+(vSteps+1), d = c+1;
      indices.push(a,c,b2, b2,c,d);
    }
  }

  // Extrude the sheet into a thin solid along its own surface normals, so the fin
  // has an edge when viewed side-on instead of vanishing like a paper cutout.
  const sheet = new THREE.BufferGeometry();
  sheet.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  sheet.setIndex(indices);
  sheet.computeVertexNormals();
  const nrm = sheet.attributes.normal.array;
  sheet.dispose();

  const vertCount = positions.length/3;
  const bbox = new THREE.Box3().setFromArray(new Float32Array(positions));
  const span = Math.max(bbox.max.x-bbox.min.x, bbox.max.y-bbox.min.y, bbox.max.z-bbox.min.z);
  const half = (opts.thickness===undefined ? span*0.012 : opts.thickness)*0.5;

  const solidPos = [], solidCol = [];
  for(let s=0; s<2; s++){
    const sign = s===0 ? 1 : -1;
    for(let i=0; i<vertCount; i++){
      solidPos.push(
        positions[i*3]   + nrm[i*3]  *half*sign,
        positions[i*3+1] + nrm[i*3+1]*half*sign,
        positions[i*3+2] + nrm[i*3+2]*half*sign
      );
      const dim = s===0 ? 1 : 0.88; // the far face sits in its own shadow
      solidCol.push(colors[i*3]*dim, colors[i*3+1]*dim, colors[i*3+2]*dim);
    }
  }
  const solidIdx = [];
  for(let i=0; i<indices.length; i+=3){
    solidIdx.push(indices[i], indices[i+1], indices[i+2]);
    solidIdx.push(indices[i+2]+vertCount, indices[i+1]+vertCount, indices[i]+vertCount); // back face, wound the other way
  }
  const idxAt = (ui,vi)=> ui*(vSteps+1)+vi;
  function rim(a, b2){ solidIdx.push(a, b2, a+vertCount, b2, b2+vertCount, a+vertCount); }
  for(let vi=0; vi<vSteps; vi++){                       // trailing edge
    rim(idxAt(uSteps,vi+1), idxAt(uSteps,vi));
    rim(idxAt(0,vi), idxAt(0,vi+1));                    // root edge
  }
  for(let ui=0; ui<uSteps; ui++){                       // the two side edges
    rim(idxAt(ui,0), idxAt(ui+1,0));
    rim(idxAt(ui+1,vSteps), idxAt(ui,vSteps));
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(solidPos,3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(solidCol,3));
  geo.setIndex(solidIdx);
  geo.computeVertexNormals();
  return geo;
}
function makeFinGeometry(pts){
  const positions = [];
  pts.forEach(p=>positions.push(p[0],p[1],p[2]));
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  const indices = [];
  for(let i=1;i<pts.length-1;i++) indices.push(0,i,i+1);
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function smooth01(e0,e1,x){
  const t = Math.min(1, Math.max(0, (x-e0)/(e1-e0)));
  return t*t*(3-2*t);
}
function scaleBump(b, angFrac, rows, cols){
  const rowPos = b*rows;
  const row = Math.floor(rowPos);
  const rowFrac = rowPos-row;
  const colShift = (row%2)*0.5;
  const colPos = angFrac*cols + colShift;
  const col = Math.floor(colPos);
  const colFrac = colPos-col;
  const dx = rowFrac-0.62, dy = colFrac-0.5;
  const d = Math.sqrt(dx*dx*1.7 + dy*dy);
  return Math.max(0, 1-d*2.15);
}

function buildFishBody(length, species){
  // per-individual variation so a school doesn't read as clones:
  // small shifts in hue/saturation/brightness plus body and fin proportions
  const variant = {
    hue:   (Math.random()-0.5)*0.030,
    sat:   0.90 + Math.random()*0.20,
    lum:   0.93 + Math.random()*0.14,
    hMul:  0.93 + Math.random()*0.14,
    wMul:  0.94 + Math.random()*0.12,
    finMul:0.88 + Math.random()*0.24
  };
  function applyVariant(col){
    const hsl = {h:0,s:0,l:0};
    col.getHSL(hsl);
    col.setHSL(
      (hsl.h + variant.hue + 1) % 1,
      THREE.MathUtils.clamp(hsl.s*variant.sat, 0, 1),
      THREE.MathUtils.clamp(hsl.l*variant.lum, 0.02, 0.98)
    );
    return col;
  }
  const height = length*species.heightScale*variant.hMul, width = length*species.widthScale*variant.wMul;
  const detailMult = (species.detailMult || 1) * 1.5;
  const ringCount = Math.round(34*detailMult), radialSegs = Math.round(18*detailMult);
  const positions = [], colors = [], bValues = [], uvs = [];
  const c = new THREE.Color();

  function profileAt(b){
    const profile = Math.sin(b*Math.PI);
    const taper = 1 - Math.pow(b,3)*0.55;
    // caudal peduncle: real fish pinch in just ahead of the tail fin rather than
    // tapering smoothly to a point — the wrist the tail beats from
    const d = (b-0.87)/0.075;
    const peduncle = 1 - 0.26*Math.exp(-0.5*d*d);
    return {
      halfH: Math.max(0.01, height*0.5*profile*taper*peduncle),
      halfW: Math.max(0.01, width*0.5*profile*taper*(0.5+0.5*peduncle))
    };
  }

  // The MESH now only carries a soft, low-frequency undulation — a few broad
  // bands, not one bump per vertex. Anything at scale frequency is the normal
  // map's job; the geometry can't resolve it and just aliases into a knit.
  const rippleRows = Math.max(4, Math.round(length*12));
  const rippleCols = Math.max(6, Math.round(radialSegs/3));
  const scaleFade = (b)=> smooth01(0,0.1,b) * (1-smooth01(0.86,1,b));

  // TEXTURE scale density, in scales per world unit, independent of mesh detail.
  // Rounded to whole multiples of the tile grid so the repeat stays seamless.
  const bodyGirth = Math.PI * 0.5 * (height*0.85 + width); // rough mid-body perimeter
  const scalesAlong = Math.max(SCALE_TEX_ROWS,
    Math.round(length*SCALES_PER_UNIT/SCALE_TEX_ROWS)*SCALE_TEX_ROWS);
  const scalesAround = Math.max(SCALE_TEX_COLS,
    Math.round(bodyGirth*SCALES_PER_UNIT/SCALE_TEX_COLS)*SCALE_TEX_COLS);

  for(let r=0; r<ringCount; r++){
    const b = r/(ringCount-1);
    const {halfH, halfW} = profileAt(b);
    const fade = scaleFade(b);
    for(let s=0; s<radialSegs; s++){
      const ang = (s/radialSegs)*Math.PI*2;
      const angFrac = s/radialSegs;
      const bump = scaleBump(b, angFrac, rippleRows, rippleCols);
      const rMul = 1 + (bump-0.4)*0.022*fade; // was 0.11 — a whisper of relief, not a quilt
      const cy = Math.sin(ang)*halfH*rMul;
      positions.push(Math.cos(ang)*halfW*rMul, cy, (b-0.5)*length);
      bValues.push(b);
      uvs.push(b, angFrac);
      species.colorFn(c, b, halfH? cy/(halfH*rMul) : 0);
      const hsl = {h:0,s:0,l:0};
      c.getHSL(hsl);
      c.setHSL(hsl.h, Math.min(1, hsl.s*1.1), hsl.l);
      applyVariant(c);
      const shade = 1 - bump*0.04*fade;
      const peakBoost = Math.max(0, bump-0.7)*0.18*fade;
      // lateral line — the row of sensory pores running the length of the flank,
      // dotted rather than solid, and only on the sides (not the back or belly)
      const cyN = halfH ? cy/(halfH*rMul) : 0;
      const flank = Math.abs(Math.cos(ang));                            // strongest where the body faces sideways
      const lineBand = Math.exp(-Math.pow((cyN-0.12)/0.10, 2));
      const dots = 0.55 + 0.45*Math.abs(Math.sin(b*Math.PI*Math.max(8, length*40)));
      const lateral = 1 - 0.16*lineBand*flank*smooth01(0.16,0.28,b)*(1-smooth01(0.90,1,b))*dots;
      colors.push(
        Math.min(1, c.r*shade*lateral + peakBoost*0.15),
        Math.min(1, c.g*shade*lateral + peakBoost*0.15),
        Math.min(1, c.b*shade*lateral + peakBoost*0.2)
      );
    }
  }
  const indices = [];
  for(let r=0;r<ringCount-1;r++){
    for(let s=0;s<radialSegs;s++){
      const a=r*radialSegs+s, b2=r*radialSegs+(s+1)%radialSegs;
      const cc=(r+1)*radialSegs+s, d=(r+1)*radialSegs+(s+1)%radialSegs;
      indices.push(a,cc,b2, b2,cc,d);
    }
  }
  const headIdx = positions.length/3;
  positions.push(0,0,-length*0.52); bValues.push(0); uvs.push(0, 0.5);
  species.colorFn(c,0,0.6); applyVariant(c); colors.push(c.r,c.g,c.b);
  for(let s=0;s<radialSegs;s++) indices.push(headIdx, s, (s+1)%radialSegs);
  const tailIdx = positions.length/3;
  const lastRing = (ringCount-1)*radialSegs;
  positions.push(0,0,length*0.5); bValues.push(1); uvs.push(1, 0.5);
  species.colorFn(c,1,-0.6); applyVariant(c); colors.push(c.r,c.g,c.b);
  for(let s=0;s<radialSegs;s++) indices.push(tailIdx, lastRing+(s+1)%radialSegs, lastRing+s);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  // normal map tiled to match the scale rows/cols baked into the vertices above
  const bodyNormalTex = scaleNormalTexture.clone();
  bodyNormalTex.needsUpdate = true;
  bodyNormalTex.wrapS = bodyNormalTex.wrapT = THREE.RepeatWrapping;
  bodyNormalTex.repeat.set(scalesAlong/SCALE_TEX_ROWS, scalesAround/SCALE_TEX_COLS);

  const matOpts = Object.assign(
    { vertexColors:true, roughness:0.28, metalness:0.15, clearcoat:0.8, clearcoatRoughness:0.08, side:THREE.DoubleSide,
      normalMap: bodyNormalTex, normalScale: new THREE.Vector2(0.3, 0.3),
      sheen: new THREE.Color(0x9fd8e8) }, // soft wet rim-light off the flanks
    species.matTune || {}
  );
  if (sharedEnvMap){ matOpts.envMap = sharedEnvMap; matOpts.envMapIntensity = species.matTune ? 1 : 0.55; }
  const mat = new THREE.MeshPhysicalMaterial(matOpts);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.userData = {basePositions: positions.slice(), bValues};

  // fins are thin membrane over rays — transmission lets light through where the
  // specular is weak, so they read as translucent rather than as painted card
  const finBaseColor = applyVariant(new THREE.Color(species.finColor));
  const finMatOpts = {
    color: 0xffffff, vertexColors:true, roughness:0.38, side:THREE.DoubleSide,
    transparent:true, opacity:0.92,
    transmission:0.55, ior:1.33, clearcoat:0.35, clearcoatRoughness:0.25,
    sheen: new THREE.Color(0xbfe6f2)
  };
  if (species.matTune){
    finMatOpts.roughness = Math.max(0.2, species.matTune.roughness);
    if (sharedEnvMap){ finMatOpts.envMap = sharedEnvMap; finMatOpts.envMapIntensity = 0.6; }
  } else if (sharedEnvMap){
    finMatOpts.envMap = sharedEnvMap; finMatOpts.envMapIntensity = 0.4;
  }
  const finMat = new THREE.MeshPhysicalMaterial(finMatOpts);
  const tailScale = (species.tailScale || 1) * variant.finMul;
  const tailFinGeo = makeDetailedFinGeometry([
    [0,0,0],
    [0, height*0.65*tailScale, length*0.24*tailScale],
    [0, 0, length*0.1*tailScale],
    [0, -height*0.65*tailScale, length*0.24*tailScale]
  ], finBaseColor, {rayCount:6});
  const tailFin = new THREE.Mesh(tailFinGeo, finMat);
  tailFin.position.z = length*0.42;
  tailFin.castShadow = true;

  const dorsalGeo = makeDetailedFinGeometry([
    [0,0,0],
    [0, height*0.6, length*0.16],
    [0, height*0.12, -length*0.14]
  ], finBaseColor, {rayCount:4});
  const dorsal = new THREE.Mesh(dorsalGeo, finMat);
  dorsal.position.z = -length*0.02;
  dorsal.position.y = height*0.3;
  dorsal.castShadow = true;

  // eyes — small fish get the layered build (limbal ring, sunken pupil, clear
  // corneal dome); medium and large fish keep the original flat iris/pupil with
  // painted glints, which reads better at the size they're actually seen.
  const bEye = 0.1;
  const eyeProf = profileAt(bEye);
  const eyeZ = (bEye-0.5)*length;
  const eyeY = eyeProf.halfH*0.32;
  // per-species eye tuning: eyeScale shrinks the whole eye, eyeBulge flattens it
  // against the head along the outward axis (1 = the default proportions)
  const eyeScale = species.eyeScale === undefined ? 1 : species.eyeScale;
  const eyeBulge = species.eyeBulge === undefined ? 1 : species.eyeBulge;
  const eyeR = Math.max(0.01, Math.min(height*0.095, length*0.065)) * eyeScale;
  const eyesGroup = new THREE.Group();

  if (length >= EYE_DETAIL_MAX_LENGTH){
    // original build
    const irisMat = new THREE.MeshStandardMaterial({color:0xcf9a3d, roughness:0.4, metalness:0.15});
    const pupilMat = new THREE.MeshStandardMaterial({color:0x0a0a0a, roughness:0.2});
    const glintMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.05, emissive:0xaad4e0, emissiveIntensity:0.4});
    [-1,1].forEach(side=>{
      const ex = side*eyeProf.halfW*0.9;
      const iris = new THREE.Mesh(new THREE.SphereGeometry(eyeR,14,12), irisMat);
      iris.scale.set(0.3*eyeBulge,1,1); // flattened along the outward axis so it sits flush, not bulging
      iris.position.set(ex, eyeY, eyeZ);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(eyeR*0.56,12,10), pupilMat);
      pupil.scale.set(0.35*eyeBulge,1,1);
      pupil.position.set(ex + side*eyeR*0.13*eyeBulge, eyeY, eyeZ); // barely proud of the iris
      const glint = new THREE.Mesh(new THREE.SphereGeometry(eyeR*0.14,6,6), glintMat);
      glint.position.set(ex + side*eyeR*0.24*eyeBulge, eyeY+eyeR*0.32, eyeZ-eyeR*0.25);
      const glint2 = new THREE.Mesh(new THREE.SphereGeometry(eyeR*0.07,6,6), glintMat);
      glint2.position.set(ex + side*eyeR*0.19*eyeBulge, eyeY-eyeR*0.22, eyeZ-eyeR*0.1); // smaller secondary highlight, opposite corner
      eyesGroup.add(iris, pupil, glint, glint2);
    });
  } else {
    const limbalMat = new THREE.MeshStandardMaterial({color:0x1c1408, roughness:0.55});
    const irisMat = new THREE.MeshPhysicalMaterial({color:0xcf9a3d, roughness:0.35, metalness:0.25, clearcoat:0.5, clearcoatRoughness:0.15});
    const pupilMat = new THREE.MeshPhysicalMaterial({color:0x05070a, roughness:0.12, clearcoat:1, clearcoatRoughness:0.02});
    const corneaMat = new THREE.MeshPhysicalMaterial({
      color:0xffffff, roughness:0.02, metalness:0,
      transparent:true, opacity:0.22, transmission:0.92, ior:1.38,
      clearcoat:1, clearcoatRoughness:0.02, side:THREE.FrontSide, depthWrite:false
    });
    if (sharedEnvMap){ corneaMat.envMap = sharedEnvMap; corneaMat.envMapIntensity = 1.4; irisMat.envMap = sharedEnvMap; }
    [-1,1].forEach(side=>{
      const ex = side*eyeProf.halfW*0.9;
      const limbal = new THREE.Mesh(new THREE.SphereGeometry(eyeR*1.1,14,12), limbalMat);
      limbal.scale.set(0.28*eyeBulge,1,1);
      limbal.position.set(ex - side*eyeR*0.02, eyeY, eyeZ);
      const iris = new THREE.Mesh(new THREE.SphereGeometry(eyeR,16,14), irisMat);
      iris.scale.set(0.3*eyeBulge,1,1);
      iris.position.set(ex, eyeY, eyeZ);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(eyeR*0.56,14,12), pupilMat);
      pupil.scale.set(0.3*eyeBulge,1,1);
      pupil.position.set(ex - side*eyeR*0.02, eyeY, eyeZ); // set slightly INTO the iris, so it reads as a hole
      const cornea = new THREE.Mesh(new THREE.SphereGeometry(eyeR*1.06,18,16), corneaMat);
      cornea.scale.set(0.5*eyeBulge,1,1); // bulges a little proud of the iris, as a real cornea does
      cornea.position.set(ex + side*eyeR*0.1*eyeBulge, eyeY, eyeZ);
      cornea.renderOrder = 2;
      eyesGroup.add(limbal, iris, pupil, cornea);
    });
  }

  // gill slits — a distinct dark curved line on each cheek, marking the operculum edge
  const bGill = 0.19;
  const gillProf = profileAt(bGill);
  const gillZ = (bGill-0.5)*length;
  const gillScale = species.gillScale || 1;
  const gillMat = new THREE.MeshStandardMaterial({color:0x180a0a, roughness:0.65, transparent:true, opacity:0.85, side:THREE.DoubleSide});
  const gillGeo = makeFinGeometry([
    [0,0,0],
    [0, gillProf.halfH*0.8*gillScale, length*0.025],
    [0, gillProf.halfH*0.1*gillScale, length*0.06],
    [0, -gillProf.halfH*0.8*gillScale, length*0.025]
  ]);
  const gillsGroup = new THREE.Group();
  [-1,1].forEach(side=>{
    const g = new THREE.Mesh(gillGeo, gillMat);
    g.position.set(side*gillProf.halfW*0.99, 0, gillZ);
    g.rotation.y = side>0 ? Math.PI/2 : -Math.PI/2;
    gillsGroup.add(g);
  });

  // pectoral fins — paired, lateral, just behind the gills
  const bPec = 0.25;
  const pecProf = profileAt(bPec);
  const pecZ = (bPec-0.5)*length;
  const pecExtent = pecProf.halfW;
  const pecGeo = makeDetailedFinGeometry([
    [0,0,0],
    [pecExtent*0.55, height*0.05, -length*0.012],
    [pecExtent*0.65, -height*0.18, length*0.025],
    [pecExtent*0.35, -height*0.28, length*0.065]
  ], finBaseColor, {rayCount:4, billow:0.6});
  const pectoralsGroup = new THREE.Group();
  [-1,1].forEach(side=>{
    const p = new THREE.Mesh(pecGeo, finMat);
    p.position.set(side*pecProf.halfW*0.88, -pecProf.halfH*0.05, pecZ);
    p.scale.x = side;
    p.castShadow = true;
    pectoralsGroup.add(p);
  });

  // anal fin — single, ventral midline, behind the belly
  const analGeo = makeDetailedFinGeometry([
    [0,0,0],
    [0, -height*0.48, length*0.13],
    [0, -height*0.08, -length*0.09]
  ], finBaseColor, {rayCount:4});
  const anal = new THREE.Mesh(analGeo, finMat);
  anal.position.set(0, -height*0.26, length*0.06);
  anal.castShadow = true;

  // mouth — a small dark line at the tip of the snout
  const mouthMat = new THREE.MeshStandardMaterial({color:0x241212, roughness:0.6});
  const mouthGeo = new THREE.SphereGeometry(Math.max(0.008, width*0.11), 8, 6);
  const mouth = new THREE.Mesh(mouthGeo, mouthMat);
  mouth.scale.set(1, 0.22, 0.55);
  const bMouth = 0.02;
  const mouthProf = profileAt(bMouth);
  mouth.position.set(0, -mouthProf.halfH*0.1, (bMouth-0.5)*length - width*0.05);

  const inner = new THREE.Group();
  inner.add(mesh, tailFin, dorsal, eyesGroup, gillsGroup, pectoralsGroup, anal, mouth);
  inner.rotation.y = Math.PI; // Object3D.lookAt() faces +Z for non-camera objects; this corrects head-first orientation
  const group = new THREE.Group();
  group.add(inner);
  group.userData = {mesh, tailFin};
  return group;
}
function updateFishBody(group, t){
  const {mesh, tailFin, undFreq, undAmp} = group.userData;
  const geo = mesh.geometry;
  const {basePositions, bValues} = mesh.userData;
  const arr = geo.attributes.position.array;
  for(let i=0;i<bValues.length;i++){
    const b = bValues[i];
    let dx = Math.sin(t*undFreq - b*6.0)*undAmp*Math.pow(b,1.6);
    const bx = basePositions[i*3], by = basePositions[i*3+1];
    const radius = Math.sqrt(bx*bx + by*by);
    const maxDx = radius*1.0 + 0.002;
    if (dx > maxDx) dx = maxDx; else if (dx < -maxDx) dx = -maxDx;
    arr[i*3] = bx + dx;
  }
  geo.attributes.position.needsUpdate = true;
  const tailDx = Math.sin(t*undFreq - 1.15*6.0)*undAmp*Math.pow(1.15,1.6);
  tailFin.position.x = tailDx;
}

// the back grass shelter clumps live at these spots — small fish with shelterBias steer toward them
const shelterSpots = [
  new THREE.Vector3(-6.1, 0.35, -1.15), new THREE.Vector3(-6.2, 0.2, 0.15), // flatter shelter — lower target height
  new THREE.Vector3(0.1, 0.35, -1.15), new THREE.Vector3(0, 0.4, 0.15),
  new THREE.Vector3(6.3, 0.35, -1.15), new THREE.Vector3(6.2, 0.2, 0.15), // flatter shelter — lower target height
];
function nearestShelterSpot(pos){
  let best = shelterSpots[0], bestD = Infinity;
  for(const s of shelterSpots){ const d = pos.distanceTo(s); if (d < bestD){ bestD = d; best = s; } }
  return best;
}

// fright propagation — a scare doesn't just affect fish at the trigger point; startled fish
// startle their own neighbors in turn, with a short delay per hop so panic visibly spreads
// through the school as a wave rather than the whole tank reacting all at once
let frightQueue = [];
function startleFish(f, awayFrom){
  f.frightCooldown = 1.8+Math.random()*0.8;
  f.burstTimer = 0.4+Math.random()*0.3;
  const away = f.pos.clone().sub(awayFrom).normalize();
  const speed = Math.max(f.vel.length()||0.25, 0.45);
  f.vel.copy(away.multiplyScalar(speed));
}
function triggerFright(pos, generation, excludeFish){
  frightQueue.push({pos: pos.clone(), generation: generation||0, timer: 0.06+Math.random()*0.08, excludeFish});
}
function updateFrightPropagation(dt){
  for(let i=frightQueue.length-1; i>=0; i--){
    const item = frightQueue[i];
    item.timer -= dt;
    if (item.timer > 0) continue;
    frightQueue.splice(i,1);
    if (item.generation > 3) continue; // cap propagation depth
    const radius = 1.7;
    fish.forEach(f=>{
      if (f === item.excludeFish || f.frightCooldown > 0) return;
      const d = f.pos.distanceTo(item.pos);
      if (d < radius){
        const chance = Math.max(0, 1-d/radius) * 0.92;
        if (Math.random() < chance){
          startleFish(f, item.pos);
          triggerFright(f.pos, item.generation+1, f);
        }
      }
    });
  }
}

// a small scatter of disturbed sand — spawned when a kuhli loach digs/forages in the substrate
let sandPuffs = [];
function spawnSandPuff(x, y, z){
  const count = 6+Math.floor(Math.random()*4);
  for(let i=0;i<count;i++){
    const geo = new THREE.SphereGeometry(0.012+Math.random()*0.01, 4, 3);
    const mat = new THREE.MeshStandardMaterial({color:0xcdb896, roughness:1, transparent:true, opacity:0.85});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    scene.add(mesh);
    const ang = Math.random()*Math.PI*2;
    const speed = 0.15+Math.random()*0.25;
    sandPuffs.push({
      mesh,
      vel: new THREE.Vector3(Math.cos(ang)*speed, 0.15+Math.random()*0.2, Math.sin(ang)*speed),
      age: 0,
      duration: 0.5+Math.random()*0.4
    });
  }
}
function updateSandPuffs(dt){
  sandPuffs.forEach(p=>{
    p.age += dt;
    p.vel.y -= dt*0.4; // gently settles back down, like real disturbed sediment
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.material.opacity = 0.85*(1-Math.min(1, p.age/p.duration));
  });
  const surviving = [];
  sandPuffs.forEach(p=>{
    if (p.age >= p.duration){ scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose(); }
    else surviving.push(p);
  });
  sandPuffs = surviving;
}

// DAY/NIGHT CLOCK & FEEDING — 1 real hour = 24 tank hours; once per tank day, food is
// sprinkled at the surface and the fish come up to eat. The feeding event itself plays
// out in real time (a fixed real-second duration) so it's actually watchable, even though
// the day/night clock underneath it is running much faster than real time.
// ---------------------------------------------------------------
const TANK_TIME_SCALE = 24;       // tank seconds per real second (1 real hr = 24 tank hrs)
const TANK_DAY_SECONDS = 86400;   // one full tank day, in tank-seconds
const FEEDING_DURATION = 28;      // real seconds the feeding event lasts
let tankSeconds = 0;
let darwinClockSeconds = 0; // separate accelerated clock for day/night + displayed time in Darwin mode
let lastFeedDay = 0;
let feedingActive = false;
let feedingTimer = 0;
let foodFlakes = [];

class FoodFlake {
  constructor(x, z){
    this.pos = new THREE.Vector3(x, H-0.12, z);
    this.sinkSpeed = 0.035+Math.random()*0.03;
    this.wobble = Math.random()*20;
    this.eaten = false;
    this.landed = false;
    this.restTimer = 0;
    const geo = new THREE.SphereGeometry(0.018+Math.random()*0.012, 6, 5);
    this.mat = new THREE.MeshStandardMaterial({color:0x8a6a3f, roughness:0.75, emissive:0x000000});
    this.mesh = new THREE.Mesh(geo, this.mat);
    this.mesh.scale.set(1, 0.4, 1);
    this.mesh.position.copy(this.pos);
    scene.add(this.mesh);
  }
  update(dt, t){
    if (this.eaten) return;
    if (!this.landed){
      this.pos.y -= this.sinkSpeed*dt;
      this.pos.x += Math.sin(t*1.4+this.wobble)*0.0025;
      this.pos.z += Math.cos(t*1.1+this.wobble)*0.0025;
      this.mesh.position.copy(this.pos);
      if (this.pos.y < 0.1){ this.pos.y = 0.1; this.mesh.position.y = 0.1; this.landed = true; }
    } else {
      this.restTimer += dt;
      if (this.restTimer > 50) { this.consume(); return; } // eventually decays if never found
    }

    const tw = Math.max(0, Math.sin(t*5+this.wobble)) * Math.max(0, Math.sin(t*2.3+this.wobble*1.7));

}
function findNearestFood(pos, maxDist){
  maxDist = maxDist===undefined ? Infinity : maxDist;
  let best = null, bestD = Infinity;
  for(const f of foodFlakes){
    if (f.eaten) continue;
    const d = pos.distanceTo(f.pos);
    if (d < bestD && d <= maxDist){ bestD = d; best = f; }
  }
  return best;
}
function startFeeding(){
  feedingActive = true;
  feedingTimer = FEEDING_DURATION;
  const count = Math.max(1, Math.round(fish.length * foodAmountFraction));
  for(let i=0;i<count;i++){
    const x = (Math.random()-0.5)*(W-1.2);
    const z = (Math.random()-0.5)*(D-0.6);
    foodFlakes.push(new FoodFlake(x, z));
  }
}
function updateFeeding(dt, t){
  tankSeconds += dt*TANK_TIME_SCALE;
  if (darwinMode) darwinClockSeconds += dt*TANK_TIME_SCALE*10;
  const day = Math.floor(tankSeconds/TANK_DAY_SECONDS);
  if (day > lastFeedDay){ lastFeedDay = day; startFeeding(); }

  if (feedingActive){
    feedingTimer -= dt;
    if (feedingTimer <= 0) feedingActive = false; // stops the active rush; existing flakes keep drifting/resting
  }
  foodFlakes.forEach(f=>f.update(dt,t));
  foodFlakes = foodFlakes.filter(f=>!f.eaten);
}

  const brightness = 0.625 + 0.375*Math.cos(dayProgress*Math.PI*2); // 1.0 at peak, 0.25 at the darkest point
  currentLightLevel = brightness;

    this.hideTimer = 8+Math.random()*12;

    this.hideTarget = null;

    this.grazing = false;
    this.grazeElapsed = 0;

  updateKuhliGraze(dt){
    if (this.grazing){
      this.grazeElapsed = (this.grazeElapsed||0) + dt;
      if (this.grazeElapsed > 40){ this.grazing = false; return false; } // stuck safety net
      const wallX = this.grazeWallX;
      const distToWall = Math.abs(this.pos.x - wallX);

        const dir = new THREE.Vector3(wallX-this.pos.x, this.grazeTargetY-this.pos.y, -this.pos.z*0.5).normalize();

      } else {

        this.vel.x = THREE.MathUtils.clamp((wallX-this.pos.x)*2, -0.25, 0.25);
        this.vel.y = this.grazeDir*0.07;
        this.vel.z *= 0.9;

        if (this.pos.y < 0.15){ this.grazeDir = 1; }

        if (this.grazeDuration <= 0) this.grazing = false;

    }

      this.grazeElapsed = 0;
      this.grazeWallX = this.pos.x < 0 ? -HALF_W+0.2 : HALF_W-0.2;
      this.grazeTargetY = 0.3+Math.random()*(H*0.55);

        this.vel.lerp(toSpot.normalize().multiplyScalar(0.32), 0.15); // still traveling there
        return true;
      }

      this.hideDuration -= dt;

        let candidates = rockObstacles.filter(o => this.pos.distanceTo(o.position) < 4.5);
        if (!candidates.length) candidates = rockObstacles;

          const ang = Math.random()*Math.PI*2;

          if (clear) found = candidate;
        }
        target = found; // null if no clear angle was found after all attempts
      }

        target = nearestShelterSpot(this.pos).clone();
        target.y = Math.min(target.y, 0.2);

      this.hideElapsed = 0;

        const noticeRange = feedingActive ? Infinity : 2.2;
        if (Math.random() < noticeChance){
          const target = findNearestFood(this.pos, noticeRange);
          if (target){ this.state = 'feeding'; this.foodTarget = target; }
        }
      }

        const shelterChance = sleepy ? 0.75 : (beh.shelterBias ? 0.4 : 0);
        if (Math.random() < shelterChance){
          jitter = nearestShelterSpot(this.pos).clone().sub(this.pos).normalize();
        } else {
          jitter = new THREE.Vector3((Math.random()-0.5),(Math.random()-0.5)*0.4,(Math.random()-0.5)*0.6);
          if (beh.erratic && !sleepy) jitter.multiplyScalar(1.9);
          if (beh.bottomDweller) jitter.y *= 0.12;
          if (sleepy) jitter.y -= 0.3;

        const toTarget = this.foodTarget.pos.clone().sub(this.pos);

    }
    if (this.frightCooldown > 0) this.frightCooldown -= dt;
    const burstMult = this.burstTimer > 0 ? 2.0+Math.random()*0.7 : 1;

    this.pos.addScaledVector(this.vel, dt*burstMult);
    // hard constraint: the soft repulsion above can be outrun by a fast-moving fish (bursts,
    // or a strong food-seeking pull) — this guarantees the fish's position can never actually
    // end up inside a rock, regardless of what velocity got it there
    for(let ri=0; ri<rockObstacles.length; ri++){
      const obs = rockObstacles[ri];
      const away = this.pos.clone().sub(obs.position);
      const dist = away.length();
      if (dist < obs.radius && dist > 0.001){
        this.pos.copy(obs.position).addScaledVector(away.multiplyScalar(1/dist), obs.radius);
      }
    }
    this.group.position.copy(this.pos);

    const nibbling = this.state==='feeding' && this.foodTarget && this.foodTarget.pos.distanceTo(this.pos) <= 0.2;
    if (nibbling) this.group.position.y += Math.sin(t*6+this.bobPhase)*0.02;

    if (this.vel.lengthSq() > 0.0001){
      const look = this.pos.clone().add(this.vel);

      lookScratch.up.copy(this.group.up);
      lookScratch.lookAt(look.x, look.y, look.z);

    if (this.lastPeckTilt) this.group.rotateX(-this.lastPeckTilt);
    const peckTilt = nibbling ? (0.28+Math.sin(t*6+this.bobPhase)*0.07) : 0;
    if (peckTilt) this.group.rotateX(peckTilt);
    this.lastPeckTilt = peckTilt;

    updateFishBody(this.group, t + this.phase);
  }
}

const fish = [];

  const allKeys = Object.keys(SPECIES_DEFAULT_COUNT);
  const shuffled = allKeys.slice().sort(()=>Math.random()-0.5);
  const count = 5 + Math.floor(Math.random()*4); // 5-8 inclusive
  return shuffled.slice(0, count);
}

  const n = SPECIES_DEFAULT_COUNT[key];
  const [lo,hi] = SPECIES_LENGTH_RANGE[key];
  for(let i=0;i<n;i++) fish.push(new Fish(key, lo+Math.random()*(hi-lo)));
